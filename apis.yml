aid: solvebio
name: SolveBio
description: >-
  SolveBio is a platform for biomedical and genomic datasets that lets developers
  query, harmonize, and automate bioinformatics workflows over curated reference
  data through a REST API and first-party client libraries (Python, JavaScript,
  Ruby, and R). SolveBio has been rebranded to QuartzBio, a Precision for Medicine
  company: the solvebio.com website now redirects to quartz.bio, the legacy API is
  served as the QuartzBio EDP REST API on per-customer instance hosts, and the
  SolveBio SDKs are being deprecated in favor of the quartzbio packages (Python
  client end of maintenance 2026-03-31). Surfaced as a portfolio company of a16z
  and enriched from its public GitHub organization and package registries.
